name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main  # Berjalan otomatis setiap push ke branch main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx (biar build lebih cepat & caching efisien)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login ke Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build dan Push Image ke Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/runpod-audio-cloning:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/runpod-audio-cloning:${{ github.sha }}
          # Caching layer docker agar build berikutnya tidak dari nol
          cache-from: type=gha
          cache-to: type=gha,mode=max